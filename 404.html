<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esta página no existe · R de Retazos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Karla:wght@400;700&display=swap">
<style>
:root{color-scheme:light;--marfil:#FAF6F0;--carbon:#2E2A26;--taupe:#6B6057;--mauve:#A8808A;
  --salvia:#5E6E52;--salvia-2:#4B5942;--lino:#E7DACB}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--marfil);
  color:var(--taupe);font-family:"Karla",system-ui,sans-serif;font-size:16px;line-height:1.65;
  padding:2rem 20px}
.c{width:100%;max-width:34rem;text-align:center}
.r{width:54px;height:54px;margin:0 auto 1.6rem;border:1px solid var(--carbon);border-radius:50%;
  display:grid;place-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;color:var(--carbon)}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;color:var(--carbon);
  font-size:clamp(1.9rem,6vw,2.9rem);line-height:1.1}
h1 em{font-style:italic;color:var(--mauve)}
p{margin:1rem auto 0;max-width:42ch}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:2rem;padding:.78rem 1.45rem;
  border-radius:999px;background:var(--salvia);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;
  border:1.5px solid var(--salvia);transition:background-color .25s}
a:hover{background:var(--salvia-2)}
a:focus-visible{outline:2.5px solid var(--carbon);outline-offset:3px}
</style>
</head>
<body>
  <main class="c">
    <div class="r" aria-hidden="true">R</div>
    <h1>Este retazo <em>no quedó en nada</em>.</h1>
    <p>La página que buscabas no existe o cambió de dirección. Lo que sí está, está todo en la portada.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
