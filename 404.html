<style>
/* Las mismas fuentes del sitio, servidas desde el propio sitio: esta página
   tampoco le pide nada a un servidor de terceros. */
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400 500;font-display:swap;src:url(/fuentes/cormorant-garamond-400_500-normal-latin.5d618c46.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(/fuentes/cormorant-garamond-500-italic-latin.efd94eb5.woff2) format('woff2')}
@font-face{font-family:'Karla';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fuentes/karla-400_700-normal-latin.690fabf2.woff2) format('woff2')}
:root{color-scheme:light;--marfil:#FAF6F0;--carbon:#2E2A26;--taupe:#6B6057;--mauve:#A8808A;
  --salvia:#5E6E52;--salvia-2:#4B5942;--lino:#E7DACB}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--marfil);
  color:var(--taupe);font-family:"Karla",system-ui,sans-serif;font-size:16px;line-height:1.65;
  padding:2rem 20px}
.c{width:100%;max-width:34rem;text-align:center}
.r{display:block;width:96px;height:96px;margin:0 auto 1.6rem}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;color:var(--carbon);
  font-size:clamp(1.9rem,6vw,2.9rem);line-height:1.1}
h1 em{font-style:italic;font-weight:500;color:var(--mauve)}
p{margin:1rem auto 0;max-width:42ch}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:2rem;padding:.78rem 1.45rem;
  border-radius:999px;background:var(--salvia);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;
  border:1.5px solid var(--salvia);transition:background-color .25s}
a:hover{background:var(--salvia-2)}
a:focus-visible{outline:2.5px solid var(--carbon);outline-offset:3px}
</style>
</head>
<body>
  <main class="c">
    <img class="r" src="/fotos/marca/logo.webp" alt="R de Retazos" width="96" height="96">
